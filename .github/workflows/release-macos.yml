name: Build notarized Haken DMG

on:
  workflow_dispatch:
    inputs:
      version:
        description: Marketing version (for example 1.2.3)
        required: true
        type: string
      build_number:
        description: Positive integer build number
        required: true
        type: string
      publish:
        description: Create a GitHub Release (main only)
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: haken-release-${{ github.ref }}-${{ inputs.version }}-${{ inputs.build_number }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Reject publishing from a non-main branch
        if: ${{ inputs.publish && github.ref != 'refs/heads/main' }}
        run: |
          echo "error: publish is allowed only from main" >&2
          exit 1
      - name: Verify before signing
        run: Scripts/verify.sh
      - name: Import Developer ID certificate and configure notarization
        id: signing
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          NOTARY_KEY_ID: ${{ vars.APP_STORE_CONNECT_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ vars.APP_STORE_CONNECT_ISSUER_ID }}
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          NOTARY_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          for name in APPLE_TEAM_ID NOTARY_KEY_ID NOTARY_ISSUER_ID CERTIFICATE_BASE64 CERTIFICATE_PASSWORD NOTARY_KEY_BASE64; do
            if [[ -z "${!name}" ]]; then echo "error: required signing configuration is missing: ${name}" >&2; exit 1; fi
          done
          keychain="$RUNNER_TEMP/haken-signing.keychain-db"
          p12_path="$RUNNER_TEMP/developer-id.p12"
          api_key_path="$RUNNER_TEMP/AuthKey_${NOTARY_KEY_ID}.p8"
          keychain_password="$(openssl rand -hex 24)"
          echo "::add-mask::$keychain_password"
          echo "keychain_path=$keychain" >> "$GITHUB_OUTPUT"
          echo "api_key_path=$api_key_path" >> "$GITHUB_OUTPUT"
          printf '%s' "$CERTIFICATE_BASE64" | base64 -D > "$p12_path"
          printf '%s' "$NOTARY_KEY_BASE64" | base64 -D > "$api_key_path"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$p12_path" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          identity="$(security find-identity -v -p codesigning "$keychain" | awk -F'"' -v suffix="($APPLE_TEAM_ID)" '$2 ~ /^Developer ID Application:/ && substr($2, length($2) - length(suffix) + 1) == suffix { print $2; count++ } END { if (count != 1) exit 1 }')" || {
            echo "error: expected exactly one Developer ID Application identity for APPLE_TEAM_ID" >&2
            exit 1
          }
          if [[ -z "$identity" ]]; then echo "error: no Developer ID Application identity matches APPLE_TEAM_ID" >&2; exit 1; fi
          echo "signing_identity=$identity" >> "$GITHUB_OUTPUT"
          xcrun notarytool store-credentials HAKEN_NOTARY --key "$api_key_path" \
            --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --keychain "$keychain"
      - name: Build and sign Universal app and DMG
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
          MARKETING_VERSION: ${{ inputs.version }}
          SIGNING_IDENTITY: ${{ steps.signing.outputs.signing_identity }}
        run: Scripts/build-direct-release.sh
      - name: Notarize, staple, and verify the DMG
        env:
          KEYCHAIN_PATH: ${{ steps.signing.outputs.keychain_path }}
        run: |
          set -euo pipefail
          dmg="build/release/Haken-macos-universal.dmg"
          xcrun notarytool submit "$dmg" --keychain "$KEYCHAIN_PATH" \
            --keychain-profile HAKEN_NOTARY --wait --timeout 30m --output-format json > "$RUNNER_TEMP/notary-result.json"
          status="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("status", ""))' "$RUNNER_TEMP/notary-result.json")"
          if [[ "$status" != "Accepted" ]]; then
            echo "error: notarization status was '$status' (expected Accepted)" >&2
            cat "$RUNNER_TEMP/notary-result.json" >&2
            exit 1
          fi
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          hdiutil verify "$dmg"
          codesign --verify --verbose=2 "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg"
          (cd build/release && shasum -a 256 Haken-macos-universal.dmg > Haken-macos-universal.dmg.sha256)
          (cd build/release && shasum -a 256 -c Haken-macos-universal.dmg.sha256)
      - name: Upload notarized release artifact
        uses: actions/upload-artifact@v4
        with:
          name: Haken-macos-notarized-${{ inputs.version }}-${{ inputs.build_number }}
          path: |
            build/release/Haken-macos-universal.dmg
            build/release/Haken-macos-universal.dmg.sha256
          if-no-files-found: error
          retention-days: 7
      - name: Publish GitHub Release
        if: ${{ inputs.publish && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          tag="v${VERSION}-${BUILD_NUMBER}"
          gh release create "$tag" \
            build/release/Haken-macos-universal.dmg \
            build/release/Haken-macos-universal.dmg.sha256 \
            --target "$GITHUB_SHA" \
            --title "Haken ${VERSION} (${BUILD_NUMBER})" \
            --notes "Notarized Universal macOS release."
      - name: Remove temporary signing assets
        if: always() && steps.signing.outputs.keychain_path != ''
        env:
          KEYCHAIN_PATH: ${{ steps.signing.outputs.keychain_path }}
          API_KEY_PATH: ${{ steps.signing.outputs.api_key_path }}
        run: |
          security delete-keychain "$KEYCHAIN_PATH" || true
          rm -f "$API_KEY_PATH" "$RUNNER_TEMP/developer-id.p12"
